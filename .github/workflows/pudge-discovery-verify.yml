name: QuotaCell frontend read-only discovery verification
on:
  push:
    branches:
      - codex/pudge-pocket-discovery-repair
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Public discovery regression tests
        run: node --experimental-strip-types src/publicDiscovery.test.mjs
        working-directory: frontend
      - name: Typecheck and production build
        run: npm run build -- --base=/
        working-directory: frontend
        env:
          VITE_QUOTACELL_BROWSER: '1'
